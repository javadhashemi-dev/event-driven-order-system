services:
  postgres:
    image: postgres:16-alpine
    container_name: order_system_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: order_system_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d order_system_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: order_system_redis
    restart: unless-stopped
    command: redis-server --requirepass redispassword
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redispassword', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: order_system_jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '16686:16686' # Jaeger UI
      - '14317:4317' # OTLP gRPC
      - '14318:4318' # OTLP HTTP
      - '14268:14268' # Jaeger Thrift HTTP (optional)

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: order_system_prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:10.3.1
    container_name: order_system_grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: order_system_migrate
    environment:
      DATABASE_URL: postgresql://postgres:example@postgres:5432/order_system_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: order_system_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://postgres:example@postgres:5432/order_system_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: redispassword
      OTEL_ENABLED: 'true'
      OTEL_SERVICE_NAME: event-driven-order-system
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--no-verbose', '--tries=1', 'http://127.0.0.1:3000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
